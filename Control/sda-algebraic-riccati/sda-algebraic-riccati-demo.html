<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDA shift sidecar &mdash; sda-algebraic-riccati</title>
<style>
  body { margin: 0 auto; max-width: 780px; padding: 24px 16px 48px;
         background: #ffffff; color: #1c1c1c;
         font-family: "Source Serif Pro", Georgia, "Times New Roman", serif; line-height: 1.5; }
  h1 { font-size: 1.35rem; color: #1f4e79; margin: 0 0 .3rem; }
  p  { font-size: .95rem; margin: .4rem 0 1rem; }
  canvas { width: 100%; height: auto; display: block; border: 1px solid #e3e3e3; }
  .ctl { margin: 1rem 0 .4rem; font-size: .95rem; }
  input[type=range] { width: 340px; vertical-align: middle; }
  #read { font-family: "DejaVu Sans Mono", ui-monospace, monospace; font-size: .85rem;
          color: #1f4e79; }
</style>
</head>
<body>
<h1>Shift the Cayley parameter &tau;</h1>
<p>One plant, one knob. The curves are the images of the closed-loop poles &lambda; = &minus;1 and
&lambda; = &minus;2 under &lambda; &#8614; |(&lambda; + &tau;) / (&lambda; &minus; &tau;)|. Inspect how each
curve moves with &tau;, where the two of them sit, and which &tau; leave no bridge to build.</p>
<canvas id="c" width="720" height="340"></canvas>
<div class="ctl">
  <label>&tau; <input type="range" id="tau" min="0.10" max="6.00" step="0.01" value="2.00"></label>
</div>
<p id="read"></p>
<script>
const cv = document.getElementById("c"), g = cv.getContext("2d");
const L = 54, R = 18, T = 22, B = 40, W = cv.width, H = cv.height;
const TMIN = 0.10, TMAX = 6.00, VMAX = 1.20;
const px = t => L + (t - TMIN) / (TMAX - TMIN) * (W - L - R);
const py = v => T + (VMAX - Math.min(v, VMAX)) / VMAX * (H - T - B);
const m1 = t => Math.abs(1 - t) / (1 + t);      // image of the closed-loop pole -1
const m2 = t => Math.abs(t - 2) / (t + 2);      // image of the closed-loop pole -2
function curve(f, color) {
  g.strokeStyle = color; g.lineWidth = 1.8; g.beginPath();
  let started = false;
  for (let t = TMIN; t <= TMAX + 1e-9; t += 0.01) {
    const v = f(t);
    if (v > VMAX) { started = false; continue; }
    const x = px(t), y = py(v);
    if (started) { g.lineTo(x, y); } else { g.moveTo(x, y); started = true; }
  }
  g.stroke();
}
function draw() {
  const t = parseFloat(document.getElementById("tau").value);
  g.clearRect(0, 0, W, H);
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H);
  // axes and ticks
  g.strokeStyle = "#5b564b"; g.lineWidth = 1; g.beginPath();
  g.moveTo(L, T); g.lineTo(L, H - B); g.lineTo(W - R, H - B); g.stroke();
  g.font = "12px Georgia, serif"; g.fillStyle = "#5b564b";
  for (let v = 0; v <= VMAX + 1e-9; v += 0.4) {
    g.beginPath(); g.moveTo(L - 4, py(v)); g.lineTo(L, py(v)); g.stroke();
    g.fillText(v.toFixed(1), 8, py(v) + 4);
  }
  for (let s = 1; s <= 6; s++) {
    g.beginPath(); g.moveTo(px(s), H - B); g.lineTo(px(s), H - B + 4); g.stroke();
    g.fillText(String(s), px(s) - 3, H - B + 17);
  }
  g.fillText("\u03c4", W - R - 6, H - B + 17);
  g.fillText("multiplier", 6, T - 6);
  // the shift at which A - tau I is singular
  g.save(); g.setLineDash([5, 4]); g.strokeStyle = "#5b564b"; g.beginPath();
  g.moveTo(px(1), T); g.lineTo(px(1), H - B); g.stroke(); g.restore();
  g.fillStyle = "#5b564b"; g.fillText("A \u2212 \u03c4 I singular", px(1) + 5, T + 12);
  curve(m1, "#1f4e79");
  curve(m2, "#0f766e");
  g.fillStyle = "#1f4e79"; g.fillText("|m\u2081|, closed loop \u22121", W - R - 140, T + 12);
  g.fillStyle = "#0f766e"; g.fillText("|m\u2082|, closed loop \u22122", W - R - 140, T + 28);
  // current shift
  const a = m1(t), b = m2(t);
  g.strokeStyle = "#b45309"; g.lineWidth = 1; g.beginPath();
  g.moveTo(px(t), T); g.lineTo(px(t), H - B); g.stroke();
  g.fillStyle = "#b45309";
  if (a <= VMAX) { g.beginPath(); g.arc(px(t), py(a), 3.5, 0, 7); g.fill(); }
  if (b <= VMAX) { g.beginPath(); g.arc(px(t), py(b), 3.5, 0, 7); g.fill(); }
  const s = Math.max(a, b);
  document.getElementById("read").textContent =
    "\u03c4 = " + t.toFixed(2) + "    |m\u2081| = " + a.toFixed(4) +
    "    |m\u2082| = " + b.toFixed(4) + "    \u03c3 = " + s.toFixed(4);
}
document.getElementById("tau").addEventListener("input", draw);
draw();
</script>
</body>
</html>
