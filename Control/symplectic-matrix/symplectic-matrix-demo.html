<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase-space patch under a linear flow</title>
<style>
  :root { --navy:#1f4e79; --teal:#0f766e; }
  body { margin:0; background:#ffffff; color:#1a1a1a;
         font:16px/1.5 "Source Serif Pro", Georgia, "Times New Roman", serif; }
  main { max-width:820px; margin:0 auto; padding:24px; }
  h1 { font-size:1.25rem; color:var(--navy); }
  p  { max-width:44rem; }
  .wrap { display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start; }
  canvas { border:1px solid #ddd; background:#fff; }
  label { display:block; margin:12px 0 2px; font-size:.9rem; }
  input[type=range] { width:200px; }
  output { font-family:"DejaVu Sans Mono", monospace; font-size:.85rem; color:var(--navy); }
</style>
</head>
<body>
<main>
  <h1>Phase-space patch under a linear flow</h1>
  <p>State <i>x</i> = (<i>q</i>, <i>p</i>), with <i>q</i>&#8242; = <i>p</i> and
     <i>p</i>&#8242; = &#8722;<i>k q</i> &#8722; <i>c p</i>. The gray square is one small patch at
     <i>t</i> = 0; the filled shape is its image at <i>t</i> = 6; the curve is the path of the
     patch centre. Move the controls and read the area ratio.</p>
  <div class="wrap">
    <canvas id="cv" width="380" height="380"></canvas>
    <div>
      <label for="k">stiffness k</label>
      <input id="k" type="range" min="0.2" max="3" step="0.05" value="1">
      <label for="c">damping c</label>
      <input id="c" type="range" min="0" max="1.5" step="0.02" value="0">
      <label for="m">integrator</label>
      <select id="m">
        <option value="rk4">RK4, step 0.005</option>
        <option value="symplectic">symplectic Euler, step 0.1</option>
        <option value="euler">explicit Euler, step 0.1</option>
      </select>
      <p><output id="out"></output></p>
    </div>
  </div>
</main>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const kEl = document.getElementById('k'), cEl = document.getElementById('c');
const mEl = document.getElementById('m'), outEl = document.getElementById('out');
const T = 6, q0 = 1.0, p0 = -0.3, half = 0.18;

function mul(A, B) {
  return [[A[0][0]*B[0][0] + A[0][1]*B[1][0], A[0][0]*B[0][1] + A[0][1]*B[1][1]],
          [A[1][0]*B[0][0] + A[1][1]*B[1][0], A[1][0]*B[0][1] + A[1][1]*B[1][1]]];
}
function oneStep(k, c, h, kind) {          // 2x2 one-step map of the chosen method
  if (kind === 'rk4') {
    const A = [[0, 1], [-k, -c]], co = [0, 1, 1/2, 1/6, 1/24];
    let S = [[1, 0], [0, 1]], M = [[1, 0], [0, 1]], hp = 1;
    for (let n = 1; n <= 4; n++) {
      M = mul(M, A); hp *= h;
      S = [[S[0][0] + M[0][0]*co[n]*hp, S[0][1] + M[0][1]*co[n]*hp],
           [S[1][0] + M[1][0]*co[n]*hp, S[1][1] + M[1][1]*co[n]*hp]];
    }
    return S;
  }
  if (kind === 'symplectic') return [[1 - h*h*k, h*(1 - h*c)], [-h*k, 1 - h*c]];
  return [[1, h], [-h*k, 1 - h*c]];        // explicit Euler
}
function flow(k, c, h, kind, N) {
  const S = oneStep(k, c, h, kind);
  let P = [[1, 0], [0, 1]];
  for (let i = 0; i < N; i++) P = mul(P, S);
  return P;
}
function draw() {
  const k = +kEl.value, c = +cEl.value, kind = mEl.value;
  const h = kind === 'rk4' ? 0.005 : 0.1, N = Math.round(T / h);
  const S = oneStep(k, c, h, kind), P = flow(k, c, h, kind, N);
  const W = cv.width, H = cv.height, m = 26, R = 2.4;
  const X = q => m + (q + R) / (2*R) * (W - 2*m);
  const Y = p => H - m - (p + R) / (2*R) * (H - 2*m);
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = '#c9c4ba'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(X(-R), Y(0)); ctx.lineTo(X(R), Y(0));
  ctx.moveTo(X(0), Y(-R)); ctx.lineTo(X(0), Y(R)); ctx.stroke();

  const corners = [[q0-half, p0-half], [q0+half, p0-half], [q0+half, p0+half], [q0-half, p0+half]];
  const image = corners.map(q => [P[0][0]*q[0] + P[0][1]*q[1], P[1][0]*q[0] + P[1][1]*q[1]]);

  ctx.strokeStyle = '#1f4e79'; ctx.lineWidth = 1.4; ctx.beginPath();
  let x = [q0, p0];
  for (let i = 0; i <= N; i++) {
    const px = X(x[0]), py = Y(x[1]);
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    x = [S[0][0]*x[0] + S[0][1]*x[1], S[1][0]*x[0] + S[1][1]*x[1]];
  }
  ctx.stroke();

  const face = (pts, fill, stroke) => {
    ctx.beginPath();
    pts.forEach((q, i) => { const px = X(q[0]), py = Y(q[1]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = stroke; ctx.stroke();
  };
  ctx.lineWidth = 1.2; face(corners, 'rgba(120,120,120,0.18)', '#8a8578');
  ctx.lineWidth = 1.6; face(image, 'rgba(15,118,110,0.25)', '#0f766e');

  const area = P[0][0]*P[1][1] - P[0][1]*P[1][0];
  outEl.textContent = 'det of flow map over T = 6  ->  area ratio = ' + area.toFixed(4);
}
[kEl, cEl, mEl].forEach(el => el.addEventListener('input', draw));
draw();
</script>
</body>
</html>
